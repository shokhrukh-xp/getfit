<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../img/wb-icon-192.png">
<title>Wellböl · Кабинет компании</title>
<!-- 30.10, роли, этап 6б: кабинет компании в браузере. Его решение: целится в
     крупные компании и банки, им нужен кабинет с компьютера — «тот же кабинет в
     браузере», не отдельный сайт. Те же ручки и правила сервера, что в
     приложении (/web/* — веб-сессия), вход по QR через бота, без пароля и
     почты. Только команда компании. Личных данных сотрудников здесь нет и
     быть не может: сервер отдаёт только цифры групп от 10 человек. -->
<style>
@font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;
  src:url(../fonts/manrope-cyr.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;src:url(../fonts/manrope-lat.woff2) format('woff2')}
:root{color-scheme:light;--bg:#EAF0F1;--surface:#FFFFFF;--tint:#E3EFF0;--line:#DCE5E6;--tab-line:#CBDADC;--text:#1F2D30;--muted:#5A6B6E;
  --accent:#176775;--on-accent:#FFFFFF;--ok:#337459;--warn:#A94E35;--warn-bg:#FBF0EB;--accent-rgb:23,103,117}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#000000;--surface:#0E1416;--tint:rgba(59,163,181,.14);--line:#1B2427;--tab-line:#1F2A2E;
  --text:#E8EEF0;--muted:#8E9DA3;--accent:#3BA3B5;--on-accent:#021013;--ok:#3FBF8A;--warn:#E07A55;--warn-bg:#22160E;--accent-rgb:59,163,181}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
/* как в приложении (28.10): родные поля даты на iPhone выходят за рамку — без системного вида и сжимаются */
:where(input[type="date"]){-webkit-appearance:none;appearance:none}
:where(input:not([type="checkbox"]):not([type="radio"]),select){min-width:0;max-width:100%}
input[type="date"]::-webkit-date-and-time-value{text-align:left;min-width:0}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{width:32px;height:32px;border-radius:8px}
.brand b{font-size:17px;font-weight:800}
.brand span{color:var(--muted);font-size:14px}
.langs{display:flex;gap:2px;background:var(--tint);border-radius:10px;padding:3px}
.langs button{border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--text)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
main{max-width:1120px;margin:0 auto;padding:24px}
.card{background:var(--surface);border-radius:20px;padding:20px 22px;margin:0 0 18px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800}
.card h3{margin:18px 0 8px;font-size:15px;font-weight:800}
.note{color:var(--muted);font-size:13px;margin:4px 0 0}
.err{color:var(--warn);font-size:14px;margin:8px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:12px;border:1px solid var(--tab-line);background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;text-decoration:none;color:var(--text)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{min-height:34px;padding:5px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.login{max-width:760px;margin:24px auto;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.qr{background:#FFFFFF;border-radius:16px;padding:12px;width:244px;height:244px;display:flex;align-items:center;justify-content:center}
.qr svg{width:220px;height:220px;display:block}
.qr.dim{opacity:.25}
.login h1{font-size:22px;margin:0 0 10px;font-weight:800}
.login ol{margin:8px 0 0;padding-left:20px}
.login li{margin:6px 0}
.state{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:1px solid var(--tab-line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.head h1{margin:0;font-size:24px;font-weight:800}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--tint);font-size:13px;font-weight:700;color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.tile{background:var(--tint);border-radius:16px;padding:14px 16px}
.tile b{display:block;font-size:28px;font-weight:800;line-height:1.2}
.tile span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.link{display:flex;gap:8px;flex-wrap:wrap}
.link input{flex:1 1 260px;min-width:0;padding:9px 12px;border-radius:12px;border:1px solid var(--tab-line);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td,.tbl tr:last-child th{border-bottom:0}
.tbl .nw{white-space:nowrap}
.tblwrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl select{padding:6px 8px;border-radius:10px;border:1px solid var(--tab-line);background:var(--surface)}
.form{display:grid;grid-template-columns:2fr 1.4fr .7fr .7fr 1fr;gap:10px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form input,.form select{padding:9px 10px;border-radius:12px;border:1px solid var(--tab-line);background:var(--surface);min-width:0}
.form .wide{grid-column:1/-1}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--warn-bg);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700}
.empty{color:var(--muted);font-size:14px}
@media (max-width:760px){
  .top{padding:12px 16px}
  main{padding:16px}
  .login{grid-template-columns:1fr;justify-items:center;text-align:left}
  .grid2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr 1fr}
  .form label:first-child{grid-column:1/-1}
  .card{padding:16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../img/wb-icon-192.png" alt=""><b>Wellböl</b><span id="ttl">Кабинет компании</span></div>
  <div class="langs" id="langs" role="group" aria-label="язык"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="uz">UZ</button><button type="button" data-lang="en">EN</button></div>
  <div class="who" id="who"></div>
</header>
<main id="app"><p class="empty">Загружаю…</p></main>
<div class="toast" id="toast" hidden></div>
<script src="../vendor/qrcode-generator-1.4.4.js"></script>
<script>
'use strict';
var API = 'https://api.wellbol.com' + (/^\/test\//.test(location.pathname) ? '/test' : '');
var КЛ_ТОК = 'wb_kab_tok', КЛ_ЯЗ = 'wb_kab_lang';
function взять(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function положить(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
var S = { lang: взять(КЛ_ЯЗ) || 'ru', сл: {}, tok: взять(КЛ_ТОК), me: null, co: null, card: {}, cardErr: {}, err: '', login: null, chf: null, invite: {}, confirm: '', meErr: '', выход: '' };

/* ── язык: те же словари, что у приложения (ключ — русская строка, числа — {0}) ── */
function т(k){
  var a = arguments, v = S.lang !== 'ru' && S.сл[S.lang] ? S.сл[S.lang][k] : null;
  return String(v == null ? k : v).replace(/\{(\d+)\}/g, function(_, i){ var x = a[+i + 1]; return x == null ? '' : x; });
}
/* текст ошибки сервера: переводим, если такая строка есть в словаре */
function тОш(s){ return т(String(s || '')); }
function язык(L){
  if (['ru', 'uz', 'en'].indexOf(L) < 0) L = 'ru';
  S.lang = L; положить(КЛ_ЯЗ, L); document.documentElement.lang = L;
  if (L === 'ru' || S.сл[L]) return Promise.resolve(рисовать());
  return fetch('../i18n/' + L + '.json').then(function(r){ return r.json(); }).then(function(d){ S.сл[L] = d; рисовать(); }).catch(function(){ рисовать(); });
}
function число(x){ return S.lang === 'en' ? String(x) : String(x).replace('.', ','); }
function дата(iso){
  var d = new Date(iso + 'T12:00:00');
  try { return d.toLocaleDateString(S.lang === 'uz' ? 'uz-Latn' : S.lang, { day: 'numeric', month: 'short' }); } catch (e) { return iso; }
}
function плюс(iso, n){ var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function сегодня(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function роль(r){ return т({ admin: 'админ', manager: 'менеджер', observer: 'наблюдатель' }[r] || r); }
function статус(s){ return т({ pending: 'на проверке', ok: 'работает', off: 'выключена' }[s] || s); }
function мера(m){ return { active_days: т('активные дни'), workouts: т('тренировки'), food_days: т('дни с записанной едой'), good_days: т('дни с оценкой от {0}', 7), steps: т('шаги') }[m] || m; }
function всплыть(t){ var e = document.getElementById('toast'); e.textContent = t; e.hidden = false; clearTimeout(всплыть.т); всплыть.т = setTimeout(function(){ e.hidden = true; }, 1800); }

/* ── сервер: веб-сессия в заголовке, 401 — назад ко входу ── */
function api(метод, путь, тело){
  var h = {}; if (тело) h['Content-Type'] = 'application/json'; if (S.tok) h.Authorization = 'Bearer ' + S.tok;
  return fetch(API + путь, { method: метод, headers: h, body: тело ? JSON.stringify(тело) : undefined }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (r.status === 401 && j.code === 'web_auth') { сброс(т('Сессия закончилась — войдите снова.')); var e0 = new Error('web_auth'); e0.code = 'web_auth'; throw e0; }
      if (!r.ok || j.ok === false) { var e = new Error(тОш(j.error) || ('HTTP ' + r.status)); e.code = j.code; throw e; }
      return j;
    });
  }, function(){ throw new Error(т('Нет связи с сервером. Проверьте интернет.')); });
}
function сброс(почему){ S.tok = null; положить(КЛ_ТОК, null); S.me = null; S.card = {}; S.выход = почему || ''; входНачать(); }

/* ── вход по QR ── */
function входНачать(){
  clearTimeout(S.опрос); S.login = { state: 'load' }; рисовать();
  api('POST', '/web/login').then(function(r){
    S.login = { state: 'wait', id: r.id, secret: r.secret, link: r.link, until: Date.now() + r.ttl * 1000 }; рисовать(); ждать();
  }).catch(function(e){ S.login = { state: 'err', err: e.message }; рисовать(); });
}
function ждать(){
  var l = S.login; clearTimeout(S.опрос); if (!l || !l.id) return;
  if (Date.now() > l.until) { l.state = 'expired'; return рисовать(); }
  S.опрос = setTimeout(function(){
    api('GET', '/web/login?id=' + encodeURIComponent(l.id) + '&secret=' + encodeURIComponent(l.secret)).then(function(r){
      if (S.login !== l) return;
      if (r.state === 'ok') { S.tok = r.token; положить(КЛ_ТОК, r.token); S.login = null; S.выход = ''; return загрузить(); }
      if (r.state === 'denied' || r.state === 'expired') { l.state = r.state; return рисовать(); }
      if (r.state !== l.state) { l.state = r.state; рисовать(); } else минуты();
      ждать();
    }).catch(function(){ if (S.login === l) ждать(); });
  }, 2000);
}
function минуты(){ var e = document.getElementById('left'), l = S.login; if (e && l) e.textContent = т('Код действует ещё {0} мин.', Math.max(1, Math.ceil((l.until - Date.now()) / 60000))); }
function qrSvg(текст, клетка){ try { var q = qrcode(0, 'M'); q.addData(текст); q.make(); return q.createSvgTag({ cellSize: клетка || 5, margin: 2, scalable: true }); } catch (e) { return ''; } }
function входHtml(){
  var l = S.login || {}, жив = l.state === 'wait' || l.state === 'asked';
  var сост = l.state === 'load' ? т('Готовлю код…') : l.state === 'asked' ? т('Подтвердите вход в Telegram на телефоне — кнопка «Войти».') : l.state === 'denied' ? т('Вход отклонён.')
    : l.state === 'expired' ? т('Код устарел.') : l.state === 'err' ? (l.err || т('Не получилось.')) : '<span id="left"></span>';
  return '<div class="login"><div class="qr' + (жив ? '' : ' dim') + '" aria-label="QR">' + (l.link ? qrSvg(l.link, 5) : '') + '</div><div>' +
    '<h1>' + т('Вход в кабинет компании') + '</h1>' +
    (S.выход ? '<p class="err">' + esc(S.выход) + '</p>' : '') +
    '<ol><li>' + т('Наведите камеру телефона на код — откроется Telegram.') + '</li><li>' + т('Нажмите «Старт», затем «Войти» в сообщении бота.') + '</li><li>' + т('Кабинет откроется здесь сам.') + '</li></ol>' +
    '<p class="note">' + т('Вход — только для команды компании: админ, менеджер, наблюдатель. Сотрудникам кабинет не нужен — у них приложение.') + '</p>' +
    '<div class="state" role="status">' + сост + '</div>' +
    '<div class="btns">' + (l.link && жив ? '<a class="btn small" href="' + esc(l.link) + '" target="_blank" rel="noopener">' + т('Открыть Telegram на этом устройстве') + '</a>' : '') +
    (!жив && l.state !== 'load' ? '<button type="button" class="btn prim" data-a="relogin">' + т('Новый код') + '</button>' : '') + '</div></div></div>';
}

/* ── кабинет ── */
function загрузить(){
  S.meErr = ''; рисовать();
  return api('GET', '/web/me').then(function(r){
    S.me = r; var ids = r.team.map(function(c){ return c.id; });
    if (ids.indexOf(S.co) < 0) S.co = (r.team.filter(function(c){ return c.status === 'ok'; })[0] || r.team[0] || {}).id || null;
    рисовать(); if (S.co) карточка(S.co);
  }).catch(function(e){ if (e.code !== 'web_auth') { S.meErr = e.message; рисовать(); } });
}
function карточка(id){
  var t = (S.me.team || []).filter(function(c){ return c.id === id; })[0];
  if (!t || t.status !== 'ok') return;
  return api('GET', '/web/co/card?co=' + encodeURIComponent(id)).then(function(r){ S.card[id] = r; S.cardErr[id] = ''; рисовать(); })
    .catch(function(e){ if (e.code !== 'web_auth') { S.cardErr[id] = e.message; рисовать(); } });
}
function недели(c){
  var w = (c.stats || []).slice(-4), мин = c.min || 10;
  var ряд = function(имя, f){ return '<tr><th scope="row">' + имя + '</th>' + w.map(function(x){ return '<td class="num">' + (x.ok ? f(x) : '—') + '</td>'; }).join('') + '</tr>'; };
  return '<div class="tblwrap"><table class="tbl"><thead><tr><th></th>' + w.map(function(x){ return '<th class="num">' + esc(дата(x.week)) + ' – ' + esc(дата(плюс(x.week, 6))) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    ряд(т('В группе'), function(x){ return т('не меньше {0}', x.n5); }) +
    ряд(т('Активны {0} дня и больше', 3), function(x){ return x.active + '%'; }) +
    ряд(т('Дней с записанной едой'), function(x){ return число(x.foodDays); }) +
    ряд(т('Тренировок'), function(x){ return число(x.workouts); }) +
    ряд(т('Дней с оценкой от {0}', 7), function(x){ return число(x.goodDays); }) +
    ряд(т('Шагов в день'), function(x){ return x.steps == null ? '—' : x.steps; }) +
    '</tbody></table></div><p class="note">' + т('«—» — меньше {0} человек в группе недели, не показываем.', мин) + ' ' +
    т('Только по группе от {0} человек и округлённо. Неделя считается один раз после её конца и больше не меняется. Средние — на человека за неделю.', мин) + '</p>';
}
function челленджи(c, t){
  var правит = t.role !== 'observer', сег = сегодня();
  var строки = (c.ch || []).map(function(ch){
    var г = ch.group || {}, конч = ch.end < сег;
    return '<tr><td><b>' + esc(ch.title) + '</b>' + (конч ? ' <span class="pill">' + т('закончился') + '</span>' : ch.start > сег ? ' <span class="pill">' + т('начнётся') + '</span>' : '') + '</td>' +
      '<td>' + esc(мера(ch.metric)) + '</td><td class="num">' + ch.target + '</td><td class="nw">' + esc(дата(ch.start)) + ' – ' + esc(дата(ch.end)) + '</td>' +
      '<td class="num">' + (г.n ? г.n : т('меньше {0}', c.min || 10)) + '</td><td class="num">' + (г.done != null ? г.done + '%' : '—') + '</td>' +
      (правит ? '<td>' + (S.confirm === 'ch:' + ch.id
        ? '<button type="button" class="btn small danger" data-a="chdel" data-id="' + esc(ch.id) + '">' + т('Снять') + '</button> <button type="button" class="btn small" data-a="no">' + т('Нет') + '</button>'
        : '<button type="button" class="btn small" data-a="ask" data-k="ch:' + esc(ch.id) + '">' + т('Снять') + '</button>') + '</td>' : '') + '</tr>';
  }).join('');
  var ф = S.chf && S.chf.co === t.id ? S.chf : null;
  return '<div class="card"><h2>' + т('Челленджи') + '</h2><p class="note">' + т('Свой прогресс каждый видит сам, компания — только долю дошедших, когда участников от {0}.', c.min || 10) + '</p>' +
    (строки ? '<div class="tblwrap"><table class="tbl"><thead><tr><th>' + т('Название') + '</th><th>' + т('Что считаем') + '</th><th class="num">' + т('Цель') + '</th><th>' + т('Сроки') + '</th><th class="num">' + т('Участники') + '</th><th class="num">' + т('Дошли') + '</th>' + (правит ? '<th></th>' : '') + '</tr></thead><tbody>' + строки + '</tbody></table></div>' : '<p class="empty">' + т('Пока нет.') + '</p>') +
    (!правит ? '' : ф ? '<div class="form">' +
      '<label>' + т('Название') + '<input id="f-title" maxlength="60" value="' + esc(ф.title) + '"></label>' +
      '<label>' + т('Что считаем') + '<select id="f-metric">' + ['active_days', 'workouts', 'food_days', 'good_days', 'steps'].map(function(m){ return '<option value="' + m + '"' + (m === ф.metric ? ' selected' : '') + '>' + esc(мера(m)) + '</option>'; }).join('') + '</select></label>' +
      '<label>' + т('Цель') + '<input id="f-target" type="number" min="1" value="' + esc(ф.target) + '"></label>' +
      '<label>' + т('Дней') + '<input id="f-days" type="number" min="3" max="60" value="' + esc(ф.days) + '"></label>' +
      '<label>' + т('Начало') + '<input id="f-start" type="date" min="' + сег + '" value="' + esc(ф.start) + '"></label>' +
      '<p class="note wide">' + т('Цель — сколько набрать за весь челлендж. Свой прогресс каждый видит сам, компания — только долю дошедших, когда участников от {0}.', c.min || 10) + '</p>' +
      (ф.err ? '<p class="err wide">' + esc(ф.err) + '</p>' : '') +
      '<div class="btns wide"><button type="button" class="btn prim" data-a="chsave"' + (ф.busy ? ' disabled' : '') + '>' + (ф.busy ? т('Сохраняю…') : т('Запустить')) + '</button><button type="button" class="btn" data-a="chno">' + т('Отмена') + '</button></div></div>'
      : '<div class="btns"><button type="button" class="btn" data-a="chnew">' + т('+ Челлендж') + '</button></div>') + '</div>';
}
function команда(c, t){
  if (!c.team) return '';
  var п = S.invite[t.id];
  return '<div class="card"><h2>' + т('Команда') + '</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>' + т('Имя') + '</th><th>' + т('Роль') + '</th><th></th></tr></thead><tbody>' +
    c.team.map(function(x){
      return '<tr><td>' + esc(x.name || т('Без имени')) + (x.me ? ' <span class="pill">' + т('вы') + '</span>' : '') + '</td>' +
        '<td><select data-a="role" data-who="' + esc(x.uid) + '" aria-label="' + esc(т('роль')) + '">' + ['admin', 'manager', 'observer'].map(function(r){ return '<option value="' + r + '"' + (r === x.role ? ' selected' : '') + '>' + esc(роль(r)) + '</option>'; }).join('') + '</select></td>' +
        '<td>' + (x.me ? '' : S.confirm === 'rm:' + x.uid
          ? '<button type="button" class="btn small danger" data-a="rm" data-who="' + esc(x.uid) + '">' + т('Убрать') + '</button> <button type="button" class="btn small" data-a="no">' + т('Нет') + '</button>'
          : '<button type="button" class="btn small" data-a="ask" data-k="rm:' + esc(x.uid) + '">' + т('Убрать') + '</button>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<h3>' + т('Позвать в команду') + '</h3><p class="note">' + т('Позвать в команду — ссылка на неделю, срабатывает один раз. Менеджер ведёт челленджи, наблюдатель только смотрит цифры.') + '</p>' +
    '<div class="btns">' + [['manager', 'Менеджера'], ['observer', 'Наблюдателя'], ['admin', 'Админа']].map(function(r){ return '<button type="button" class="btn small" data-a="inv" data-role="' + r[0] + '">' + т(r[1]) + '</button>'; }).join('') + '</div>' +
    (п ? '<p class="note">' + т('Ссылка для роли:') + ' ' + esc(роль(п.role)) + '</p><div class="link"><input readonly value="' + esc(п.link) + '" aria-label="' + esc(т('ссылка в команду')) + '"><button type="button" class="btn prim" data-a="copy" data-v="' + esc(п.link) + '">' + т('Копировать') + '</button></div>' : '') + '</div>';
}
function кабинетHtml(){
  var m = S.me;
  if (!m) return S.meErr ? '<div class="card"><p class="err">' + esc(S.meErr) + '</p><button type="button" class="btn" data-a="reload">' + т('Повторить') + '</button></div>' : '<p class="empty">' + т('Загружаю…') + '</p>';
  if (!m.team.length) return '<div class="card"><h2>' + т('Вы не в команде компании') + '</h2><p class="note">' + т('Кабинет — для админа, менеджера и наблюдателя. Если вас позвали — откройте ссылку от админа в Telegram.') + '</p></div>';
  var t = m.team.filter(function(x){ return x.id === S.co; })[0] || m.team[0];
  var вкладки = m.team.length > 1 ? '<div class="tabs" role="group">' + m.team.map(function(x){ return '<button type="button" data-a="co" data-id="' + esc(x.id) + '" aria-pressed="' + (x.id === t.id) + '">' + esc(x.name) + '</button>'; }).join('') + '</div>' : '';
  var шапка = '<div class="head"><h1>' + esc(t.name) + '</h1><span class="pill">' + esc(роль(t.role)) + '</span><span class="pill">' + esc(статус(t.status)) + '</span></div>';
  if (t.status === 'pending') return вкладки + '<div class="card">' + шапка + '<p class="note">' + т('Заявка на проверке. Как примем — здесь появится ссылка для сотрудников.') + '</p></div>';
  if (t.status !== 'ok') return вкладки + '<div class="card">' + шапка + '<p class="note">' + т('Компания выключена. Напишите в поддержку.') + '</p></div>';
  var c = S.card[t.id];
  if (!c) return вкладки + '<div class="card">' + шапка + (S.cardErr[t.id] ? '<p class="err">' + esc(S.cardErr[t.id]) + '</p><button type="button" class="btn" data-a="reload">' + т('Повторить') + '</button>' : '<p class="empty">' + т('Загружаю…') + '</p>') + '</div>';
  var мин = c.min || 10, сег = сегодня(), живых = (c.ch || []).filter(function(x){ return x.end >= сег; }).length;
  return вкладки + '<div class="card">' + шапка + (S.cardErr[t.id] ? '<p class="err">' + esc(S.cardErr[t.id]) + '</p>' : '') +
    '<div class="tiles"><div class="tile"><b>' + c.members + '</b><span>' + т('присоединились') + '</span></div>' +
    '<div class="tile"><b>' + живых + '</b><span>' + т('живых челленджей') + '</span></div>' +
    '<div class="tile"><b>' + мин + '</b><span>' + т('порог приватности: в группе меньше людей — цифры скрыты') + '</span></div></div>' +
    (c.members < мин ? '<p class="note">' + т('цифры появятся от {0} человек', мин) + '</p>' : '') + '</div>' +
    (c.link ? '<div class="card"><h2>' + т('Ссылка для сотрудников') + '</h2><p class="note">' + т('По ней сотрудник увидит, что компании видно, и присоединится сам.') + '</p>' +
      '<div class="link" style="margin-top:10px"><input readonly value="' + esc(c.link) + '" aria-label="' + esc(т('ссылка для сотрудников')) + '"><button type="button" class="btn prim" data-a="copy" data-v="' + esc(c.link) + '">' + т('Копировать') + '</button>' +
      '<button type="button" class="btn" data-a="qr">' + т('Скачать QR для плаката') + '</button></div>' +
      (t.role !== 'admin' ? '' : S.confirm === 'code'
        ? '<div class="confirm"><span>' + т('Старая ссылка перестанет работать. Кто уже присоединился — останется.') + '</span><button type="button" class="btn small danger" data-a="code">' + т('Сменить') + '</button><button type="button" class="btn small" data-a="no">' + т('Нет') + '</button></div>'
        : '<div class="btns"><button type="button" class="btn small" data-a="ask" data-k="code">' + т('Сменить ссылку') + '</button></div>') + '</div>' : '') +
    '<div class="card"><h2>' + т('Цифры по неделям') + '</h2>' + недели(c) + '</div>' +
    челленджи(c, t) + команда(c, t);
}
function шапкаКто(){
  var w = document.getElementById('who'); if (!w) return;
  w.innerHTML = S.tok && S.me ? '<span>' + esc(S.me.name || '') + '</span>' + (S.confirm === 'all'
    ? '<button type="button" class="btn small danger" data-a="outall">' + т('Выйти на всех компьютерах') + '</button><button type="button" class="btn small" data-a="no">' + т('Нет') + '</button>'
    : '<button type="button" class="btn small" data-a="out">' + т('Выйти из кабинета') + '</button><button type="button" class="btn small" data-a="ask" data-k="all">' + т('На всех компьютерах') + '</button>') : '';
}
function полеФормы(){
  var f = S.chf; if (!f) return;
  var v = function(id){ var e = document.getElementById(id); return e ? e.value : null; };
  if (v('f-title') != null) { f.title = v('f-title'); f.metric = v('f-metric'); f.target = v('f-target'); f.days = v('f-days'); f.start = v('f-start'); }
}
function рисовать(){
  полеФормы();
  document.title = 'Wellböl · ' + т('Кабинет компании');
  document.getElementById('ttl').textContent = т('Кабинет компании');
  Array.prototype.forEach.call(document.querySelectorAll('#langs button'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)); });
  document.getElementById('app').innerHTML = S.tok ? кабинетHtml() : входHtml();
  шапкаКто(); минуты();
}

/* ── действия ── */
function копировать(v){
  var ok = function(){ всплыть(т('Скопировано')); };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(v).then(ok, function(){ всплыть(v); });
  всплыть(v);
}
function действие(b){
  var a = b.dataset.a, co = S.co, ош = function(e){ b.disabled = false; if (e.code !== 'web_auth') { S.cardErr[co] = e.message; рисовать(); } };
  var освежить = function(){ S.confirm = ''; return карточка(co); };
  if (a === 'relogin') return входНачать();
  if (a === 'reload') return S.me ? карточка(co) : загрузить();
  if (a === 'co') { S.co = b.dataset.id; S.chf = null; S.confirm = ''; рисовать(); return карточка(S.co); }
  if (a === 'ask') { S.confirm = b.dataset.k; return рисовать(); }
  if (a === 'no') { S.confirm = ''; return рисовать(); }
  if (a === 'copy') return копировать(b.dataset.v);
  if (a === 'qr') {
    var c = S.card[co], svg = qrSvg(c.link, 12); if (!svg) return;
    var url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' })), ссылка = document.createElement('a');
    ссылка.href = url; ссылка.download = 'wellbol-qr.svg'; document.body.appendChild(ссылка); ссылка.click(); ссылка.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    return;
  }
  if (a === 'out' || a === 'outall') {
    b.disabled = true;
    return api('POST', '/web/logout', a === 'outall' ? { all: true } : {}).then(function(){ S.confirm = ''; сброс(''); }, function(){ сброс(''); });
  }
  if (a === 'code') { b.disabled = true; return api('POST', '/web/co/code', { co: co }).then(освежить).catch(ош); }
  if (a === 'inv') { b.disabled = true; return api('POST', '/web/co/invite', { co: co, role: b.dataset.role }).then(function(r){ S.invite[co] = { link: r.link, role: r.role }; рисовать(); }).catch(ош); }
  if (a === 'rm') { b.disabled = true; return api('POST', '/web/co/team', { co: co, who: b.dataset.who, remove: true }).then(освежить).catch(ош); }
  if (a === 'chnew') { S.chf = { co: co, title: '', metric: 'active_days', target: '5', days: '7', start: сегодня() }; return рисовать(); }
  if (a === 'chno') { S.chf = null; return рисовать(); }
  if (a === 'chsave') {
    var ф = S.chf; полеФормы(); ф.busy = true; ф.err = ''; рисовать();
    return api('POST', '/web/co/ch', { co: co, title: ф.title, metric: ф.metric, target: +ф.target, days: +ф.days, start: ф.start })
      .then(function(){ S.chf = null; return освежить(); }).catch(function(e){ ф.busy = false; ф.err = e.message; рисовать(); });
  }
  if (a === 'chdel') { b.disabled = true; return api('POST', '/web/co/ch/del', { co: co, id: b.dataset.id }).then(освежить).catch(ош); }
}
document.addEventListener('click', function(e){
  var l = e.target.closest('#langs button'); if (l) return язык(l.dataset.lang);
  var b = e.target.closest('[data-a]'); if (!b || b.tagName === 'SELECT' || b.disabled) return;
  действие(b);
});
document.addEventListener('change', function(e){
  var s = e.target.closest('select[data-a="role"]'); if (!s) return;
  var co = S.co; s.disabled = true;
  api('POST', '/web/co/team', { co: co, who: s.dataset.who, role: s.value }).then(function(){ всплыть(т('Сохранено')); return карточка(co); })
    .catch(function(e2){ if (e2.code !== 'web_auth') { S.cardErr[co] = e2.message; карточка(co); } });
});
/* вернулся на вкладку — свежие цифры; вход ждёт дальше */
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && S.tok && S.me && S.co) карточка(S.co); });

язык(S.lang);
if (S.tok) загрузить(); else входНачать();
</script>
